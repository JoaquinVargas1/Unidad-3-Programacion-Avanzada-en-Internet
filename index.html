<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #333; 
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        form {
            background-color: #fff;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 300px;
            width: 100%;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            margin: 0.5rem 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #007bff;
            border: none;
            color: white;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <form id="loginForm">
        <h1 style="color: #333;">Login</h1>
        <input type="text" id="username" placeholder="Nombre de usuario" required />
        <input type="password" id="password" placeholder="Contraseña" required />
        <button type="submit">Login</button>
    </form>

    <script>
        const API_KEY = '131955521a9bdad782e760373ef9100e';

        document.getElementById('loginForm').addEventListener('submit', async (event) => {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const tokenResponse = await fetch(`https://api.themoviedb.org/3/authentication/token/new?api_key=${API_KEY}`);
                const tokenData = await tokenResponse.json();

                if (!tokenData.success) {
                    throw new Error(`Error al obtener el token: ${tokenData.status_message}`);
                }
                
                const requestToken = tokenData.request_token;

                const validateResponse = await fetch(`https://api.themoviedb.org/3/authentication/token/validate_with_login?api_key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        request_token: requestToken
                    })
                });
                const validateData = await validateResponse.json();

                if (!validateData.success) {
                    throw new Error(`Error al validar el token: ${validateData.status_message}`);
                }

                const sessionResponse = await fetch(`https://api.themoviedb.org/3/authentication/session/new?api_key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ request_token: requestToken })
                });
                const sessionData = await sessionResponse.json();

                if (!sessionData.success) {
                    throw new Error(`Error al crear la sesión: ${sessionData.status_message}`);
                }

                localStorage.setItem('session_id', sessionData.session_id);
                alert('Login exitoso');
                window.location.href = 'movies.html';
            } catch (error) {
                alert(`Error en el proceso de login: ${error.message}`);
                console.error(error);
            }
        });
    </script>
</body>
</html>
